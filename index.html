<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro de Incidencias</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Sistema de Registro de Incidencias</h1>
    <span class="version" id="version">v1.1.1</span>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Registrar incidencia</h2>
      <form id="form-incidencia" novalidate>
        <label>Título
          <input name="titulo" type="text" placeholder="Ej.: No se puede exportar a PDF">
        </label>
        <label>Descripción
          <textarea name="descripcion" rows="3" placeholder="Describa lo que ocurre"></textarea>
        </label>
        <div class="fila">
          <label>Reportado por
            <input name="reportadoPor" type="text" placeholder="Nombre del usuario">
          </label>
          <label>Prioridad
            <select name="prioridad">
              <option value="">Seleccione…</option>
              <option>Baja</option>
              <option>Media</option>
              <option>Alta</option>
            </select>
          </label>
        </div>
        <ul id="errores" class="errores" hidden></ul>
        <button type="submit">Registrar</button>
      </form>
    </section>

    <section class="tarjeta">
      <div class="cabecera-lista">
        <h2>Incidencias registradas</h2>
        <label class="filtro">Filtrar por estado
          <select id="filtro-estado">
            <option value="todas">Todas</option>
            <option value="abierta">Abierta</option>
            <option value="en-proceso">En proceso</option>
            <option value="resuelta">Resuelta</option>
          </select>
        </label>
      </div>
      <p id="contador" class="contador"></p>
      <table>
        <thead>
          <tr><th>ID</th><th>Incidencia</th><th>Reportado por</th><th>Prioridad</th><th>Estado</th><th>Fecha</th></tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </section>
  </main>

  <footer>Gestión de la Configuración del Software · Despliegue continuo con GitHub Actions</footer>

  <script src="js/incidencias.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
